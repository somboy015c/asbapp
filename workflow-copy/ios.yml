name: Release iPhone app (App Store / TestFlight)

# GitHub -> Actions -> "Release iPhone app (App Store / TestFlight)" -> Run workflow.
# Builds the iPhone app on a Mac runner, signs it with YOUR Apple credentials and uploads it to
# App Store Connect (it then appears under TestFlight, ready to submit for review).
# One-time Apple setup and the 7 secrets it needs are explained in STORE-GUIDE.md.
#
# Version: uses the version in package.json (run the Android release first to bump it, or edit
# package.json yourself). The build number is the run number, so it always goes up.
on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    env:
      BUNDLE_ID: com.asbdataghana.app
    steps:
      - uses: actions/checkout@v4

      - name: Check the Apple secrets are set
        env:
          S1: ${{ secrets.IOS_CERT_P12_BASE64 }}
          S2: ${{ secrets.IOS_CERT_PASSWORD }}
          S3: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          S4: ${{ secrets.IOS_TEAM_ID }}
          S5: ${{ secrets.APPSTORE_ISSUER_ID }}
          S6: ${{ secrets.APPSTORE_KEY_ID }}
          S7: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          for n in 1 2 3 4 5 6 7; do
            v="S$n"; if [ -z "${!v}" ]; then echo "::error::Missing Apple secrets. Follow 'Part C: iPhone' in STORE-GUIDE.md first."; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Create the iOS project
        run: npx cap add ios

      - name: Generate app icon and splash screen
        run: npx capacitor-assets generate --ios

      - name: Copy the web app into iOS
        run: npx cap sync ios

      - name: Set version, permissions text and export compliance
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PLIST=ios/App/App/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          $PB -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          $PB -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          $PB -c "Add :NSCameraUsageDescription string 'Used only if you choose to take a photo for your store logo or images.'" "$PLIST" || true
          $PB -c "Add :NSPhotoLibraryUsageDescription string 'Used to pick your store logo and images.'" "$PLIST" || true
          $PB -c "Set :CFBundleDisplayName 'ASBData Ghana'" "$PLIST" || $PB -c "Add :CFBundleDisplayName string 'ASBData Ghana'" "$PLIST"
          echo "Version $VERSION (build ${{ github.run_number }})"

      - name: Install the signing certificate and profile
        env:
          CERT_P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KCPASS=$(openssl rand -hex 12)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed 's/"//g')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Build and archive
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" TARGETED_DEVICE_FAMILY=1

      - name: Export the IPA
        env:
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export"
          ls "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect (TestFlight)
        env:
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "### Uploaded to App Store Connect. It appears in TestFlight in about 10-20 minutes." >> "$GITHUB_STEP_SUMMARY"
